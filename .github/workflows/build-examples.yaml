# ---------------------------------------------------------------------------
# Coherence CE GitHub Actions Examples - Build.
# ---------------------------------------------------------------------------

name: Examples Build

on:
  workflow_dispatch:
    inputs:
      runner:
        default: ubuntu-latest
        required: true
        type: string
  workflow_call:
    inputs:
      runner:
        default: ubuntu-latest
        required: true
        type: string

env:
  MAVEN_OPTS: -Dhttp.keepAlive=false -Dmaven.wagon.http.pool=false

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    defaults:
      run:
        working-directory: prj
        shell: bash
    strategy:
      fail-fast: false
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK
      uses: oracle-actions/setup-java@v1
      with:
        website: oracle.com
        release: 21

    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('prj/.mvn/wrapper/maven-wrapper.properties', '**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2-

    - name: Print Maven & Java version
      run: ./mvnw -version

      # Build and Test examples
    - name: build-test-examples
      timeout-minutes: 180
      shell: bash
      env:
        MAVEN_USER: ${{ secrets.MavenUser }}
        MAVEN_PASSWORD: ${{ secrets.MavenPassword }}
      run: |
        echo "Building and Running - Examples"
        export DEV_ROOT="${GITHUB_WORKSPACE}"
        export SETTINGS_XML="${DEV_ROOT}/.github/maven/settings.xml"
        ./mvnw --file pom.xml --batch-mode -U -e -s "${SETTINGS_XML}" -P-modules -DskipTests clean install
        ./mvnw --file pom.xml --batch-mode -e -s "${SETTINGS_XML}" -Pmodules,-coherence -nsu -DskipTests clean install
        ./mvnw --file pom.xml --batch-mode -U -e -s "${SETTINGS_XML}" -Pexamples -nsu clean install

    # Upload build artifacts for diagnosing failures
    - name: Build Artifacts test logs
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: test-output
        path: prj/examples/**/target/test-output/**/*
        if-no-files-found: ignore

    - name: Build Artifacts test reports
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: failsafe-surefire-test-reports
        path: prj/examples/**/target/*-reports/**/*
        if-no-files-found: ignore

    - name: Build Artifacts core dumps
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: core-dumps
        path: prj/examples/**/core.*
        if-no-files-found: ignore

    - name: Build Artifacts compiler replays
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: compiler-replay-logs
        path: prj/examples/**/replay_pid*.log
        if-no-files-found: ignore
