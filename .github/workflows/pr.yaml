# ---------------------------------------------------------------------------
# Coherence CE GitHub Actions CI build.
# ---------------------------------------------------------------------------

name: Pull Request Build

on:
  pull_request:
    types:
      - opened
      - synchronize
    branches-ignore:
    - gh-pages
    - p4-integ*
    - last-p4-*

jobs:
  build:
    name: Parallel Build - Linux
    uses: ./.github/workflows/build.yaml
    secrets: inherit
    with:
      runner: ubuntu-latest
