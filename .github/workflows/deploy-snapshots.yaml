# This workflow will build a Java project with Maven and deploy snapshot
# artifacts to Maven Central
#
# This job is triggered by a completed run of the "CI Build" action.
# The "build" job only runs if the "CI Build" action completed successfully.
# The deployed artifacts will be built from the same commit that the "CI Build" action used.
#
name: Deploy to Maven Central

on:
  workflow_call:
    inputs:
      runner:
        default: ubuntu-latest
        required: true
        type: string

env:
  GITHUB_TOKEN: ${{ secrets.BOT_TOKEN }}
  GIT_USER: ${{ secrets.BOT_USERNAME }}
  GIT_EMAIL: ${{ secrets.BOT_EMAIL }}
  MAVEN_VERSION: 3.6.1
  MAVEN_SHA512: b4880fb7a3d81edd190a029440cdf17f308621af68475a4fe976296e71ff4a4b546dd6d8a58aaafba334d309cc11e638c52808a4b0e818fc0fd544226d952544
  MAVEN_OPTS: -Dhttp.keepAlive=false -Dmaven.wagon.http.pool=false

jobs:
  build:
    runs-on: ${{ inputs.runner }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v1
      with:
        java-version: '1.8'

    - name: Set up Maven
      shell: bash
      run: |
        set -euo pipefail
        archive="apache-maven-${MAVEN_VERSION}-bin.tar.gz"
        curl --fail --location --show-error --silent --retry 5 \
          "https://archive.apache.org/dist/maven/maven-3/${MAVEN_VERSION}/binaries/${archive}" \
          --output "${RUNNER_TEMP}/${archive}"
        echo "${MAVEN_SHA512}  ${archive}" | (cd "${RUNNER_TEMP}" && sha512sum --check -)
        mkdir -p "${RUNNER_TEMP}/maven"
        tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/maven"
        maven_home="${RUNNER_TEMP}/maven/apache-maven-${MAVEN_VERSION}"
        echo "MAVEN_HOME=${maven_home}" >> "${GITHUB_ENV}"
        echo "${maven_home}/bin" >> "${GITHUB_PATH}"

    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Build with Maven
      env:
        MAVEN_USER: ${{ secrets.MavenUser }}
        MAVEN_PASSWORD: ${{ secrets.MavenPassword }}
      run: |
        git config --local user.name "${GIT_USER}"
        git config --local user.email "${GIT_EMAIL}"
        sh tools/bin/github-deploy-snapshots.sh
