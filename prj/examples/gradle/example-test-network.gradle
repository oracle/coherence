import org.gradle.api.tasks.testing.Test

import java.util.UUID

def testRunId = UUID.randomUUID().toString()
def testNetworkDefaults = [
        'coherence.cluster'       : "example-${project.name}-${testRunId}",
        'coherence.ttl'           : '0',
        'coherence.wka'           : '127.0.0.1',
        'coherence.localhost'     : '127.0.0.1',
        'java.net.preferIPv4Stack': 'true'
]

tasks.withType(Test).configureEach { testTask ->
    testNetworkDefaults.each { propertyName, defaultValue ->
        if (!testTask.systemProperties.containsKey(propertyName)) {
            testTask.systemProperty(propertyName, System.getProperty(propertyName, defaultValue))
        }
    }
}
